name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # JVM + host-side unit tests: shared crypto/protocol, the relay,
      # and the bridge transport suite (server, splice, proof).
      - run: ./gradlew test --stacktrace
      # Lint is a gate too — it silently regressed once while CI only
      # ran the test suite.
      - run: ./gradlew lint --stacktrace
      # Both APKs must assemble — catches module-boundary regressions
      # (e.g. :client code leaking into the bridge APK).
      - run: ./gradlew :app:assembleDebug :bridgeapp:assembleDebug
